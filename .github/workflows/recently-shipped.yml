name: Recently shipped

# Refreshes the "Recently shipped" section of the profile README from the
# portfolio build log (https://franciscode.dev/build-log.json).
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recently-shipped
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README from the build log
        run: python3 .github/scripts/recently_shipped.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(README): refresh recently shipped"
          git push
